[package]
name = "aja"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `staticlib` is the runtime that `aja build` links native programs against.
crate-type = ["rlib", "staticlib"]

[dependencies]
clap = { version = "4.5.1", features = ["derive"] }
color-eyre = "0.6.3"
corosensei = "0.3.4"
cranelift-codegen = "0.138.0"
cranelift-frontend = "0.138.0"
cranelift-module = "0.138.0"
cranelift-native = "0.138.0"
cranelift-object = "0.138.0"
ecow = "0.2.2"
libc = "0.2.191"
polling = "3.7"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
