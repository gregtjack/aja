[package]
name = "aja"
version = "0.1.0"
edition = "2021"
description = "The Aja tool and its backends: the bytecode VM and ahead-of-time compilation"

[dependencies]
aja-frontend = { path = "../frontend" }
aja-runtime = { path = "../runtime" }
clap = { version = "4.5.1", features = ["derive"] }
color-eyre = "0.6.3"
cranelift-codegen = "0.138.0"
cranelift-frontend = "0.138.0"
cranelift-module = "0.138.0"
cranelift-native = "0.138.0"
cranelift-object = "0.138.0"
ecow = "0.2.2"
libc = "0.2.191"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

[dev-dependencies]
aja-runtime = { path = "../runtime", features = ["testing"] }
